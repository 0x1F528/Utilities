<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository · Git</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"></head><body class="repo-body"><header class="repo-header"><a href="./">← Repositories</a><div><h1 id="repo-title">Repository</h1><p id="repo-meta">Loading…</p></div><div class="header-right"><button id="refresh">Refresh</button></div></header>
<div class="repo-toolbar"><button id="fetch">Fetch</button><button id="push" class="primary">Push current</button><label style="display:flex;flex-direction:row;align-items:center;gap:4px;font-size:11px"><input id="force" type="checkbox">Force with lease</label><button id="stash-all">Stash changes</button><span class="spacer"></span><span id="busy"></span><span id="selection-meta" class="hint"></span></div>
<div class="repo-layout"><aside class="sidebar"><div class="list-heading"><h2>Branches</h2></div><div id="branches"></div><div class="list-heading" style="margin-top:18px"><h2>Stashes</h2></div><div id="stashes"></div></aside>
<div id="resize-left" class="panel-divider" role="separator" aria-label="Resize branches panel" aria-orientation="vertical" tabindex="0"></div><section class="center-pane" aria-label="History and diff"><div id="graph" class="graph-panel"></div><div class="diff-header"><strong id="diff-title">Select a file</strong><select id="diff-kind" aria-label="Working tree diff"><option value="unstaged">Unstaged</option><option value="staged">Staged</option></select><button id="bc">Beyond Compare</button></div><pre id="diff" class="diff-view">Select a commit or Working tree, then a file.</pre></section>
<div id="resize-right" class="panel-divider" role="separator" aria-label="Resize files panel" aria-orientation="vertical" tabindex="0"></div><aside class="files-pane"><div class="compose"><div id="compose-editor"><label for="message">Commit changes</label><textarea id="message" placeholder="Commit message"></textarea><div class="row"><label class="check"><input type="checkbox" id="amend">Amend</label><button id="commit" class="primary">Commit</button></div></div><div id="historical-message" class="message-view" hidden></div></div><div class="list-heading"><h2 id="files-title">Files</h2><button id="sort-tree">Collapse tree</button></div><div class="file-filter"><div class="file-checks"><label><input id="filter-tracked" type="checkbox" checked>Tracked</label><label><input id="filter-untracked" type="checkbox" checked>Untracked</label><label><input id="filter-ignored" type="checkbox">Ignored</label></div><input id="path-filter" aria-label="Filter file paths" placeholder="Filter paths…" style="width:100px"></div><div id="files" class="file-tree"></div><div id="file-actions" class="file-actions"><button id="stage-all">Stage all</button><button id="unstage-all">Unstage all</button><button id="discard" class="danger">Discard selected</button><button id="stash-paths">Stash selected</button></div>
</aside></div>
<div class="console-launch"><button id="open-console" hidden aria-label="Open command window">cmd&gt;</button></div><p id="feedback" role="status"></p><div id="resize-console" class="console-divider" role="separator" aria-label="Resize command window" aria-orientation="horizontal" tabindex="0"></div><section id="console" class="console"><div class="console-heading"><strong>Git command window</strong><small>Dispatched commands + output · manual Git commands run in this repository</small><button id="close-console" aria-label="Close command window">×</button></div><div id="command-log" role="log" aria-label="Git command output"></div><form id="command-form" class="command-form"><input id="command" aria-label="Git command" placeholder="git status · git log -5 --oneline · git cherry-pick &lt;commit&gt;" autocomplete="off"><button>Run Git</button><button id="clear-log" type="button">Clear view</button></form></section>
<script type="module" src="repo.js"></script></body></html>
